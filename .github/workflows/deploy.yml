name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: homescope-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Join the private deployment tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/homescope
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/homescope ~/.ssh/known_hosts
      - name: Deploy backend, AI gateway, and observability
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/homescope "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && export COMPOSE_PROFILES=observability && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans && origin_secret=\$(sed -n 's/^ORIGIN_SHARED_SECRET=//p' .env | tail -n 1) && curl --fail --retry 20 --retry-delay 3 -H \"X-HomeScope-Origin-Token: \$origin_secret\" http://127.0.0.1:8080/api/v1/health/ready && curl --fail --retry 20 --retry-delay 3 http://127.0.0.1:3001/api/health"
