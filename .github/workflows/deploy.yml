name: Deploy OCI
on:
  workflow_dispatch:
  push: { branches: [main], tags: ['v*'] }
permissions: { contents: read, packages: write }
jobs:
  publish:
    if: github.repository_owner != 'example'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, tags: 'ghcr.io/${{ github.repository_owner }}/homescope-web:latest' }
      - uses: docker/build-push-action@v6
        with: { context: apps/api, file: apps/api/Dockerfile, push: true, tags: 'ghcr.io/${{ github.repository_owner }}/homescope-api:latest' }
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: '${{ secrets.OCI_HOST }}'
          username: '${{ secrets.OCI_USER }}'
          key: '${{ secrets.OCI_SSH_KEY }}'
          script: cd /opt/homescope && docker compose pull && docker compose up -d --remove-orphans
      - name: Smoke test
        run: curl --fail --retry 12 --retry-delay 5 'https://${{ secrets.APP_DOMAIN }}/api/v1/health'
