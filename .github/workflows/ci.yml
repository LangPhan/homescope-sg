name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose --profile observability config
      - run: docker build -f apps/api/Dockerfile apps/api
      - run: docker build -f apps/web/Dockerfile .
      - name: Validate observability configuration
        run: |
          find infra/observability/grafana/dashboards -name '*.json' -print0 | xargs -0 -n1 jq empty
          docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro" grafana/loki:3.5.7 -verify-config -config.file=/etc/loki/loki.yml
          docker run --rm -v "$PWD/infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" grafana/alloy:v1.11.3 fmt --test /etc/alloy/config.alloy
      - name: Validate Grafana provisioning
        run: |
          GRAFANA_PORT=3301 docker compose --profile observability up -d prometheus loki grafana
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-all-errors --connect-timeout 3 --max-time 5 http://127.0.0.1:3301/api/health
          test "$(curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors --user admin:homescope-grafana-local http://127.0.0.1:3301/api/v1/provisioning/alert-rules | jq length)" -eq 8
      - name: Show observability logs on failure
        if: failure()
        run: |
          docker compose --profile observability ps
          docker compose --profile observability logs --no-color --tail=200 grafana prometheus loki
      - if: always()
        run: docker compose --profile observability down --volumes
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: PLAYWRIGHT_BASE_URL=http://localhost:8080 pnpm --dir apps/web test:e2e --project=chromium
