openapi: 3.1.0
info:
  title: HomeScope SG API
  version: 1.0.0
  description: REST API for synthetic Singapore property discovery.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Service health
      responses: { '200': { description: Healthy } }
  /listings:
    get:
      summary: Search listings
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: property_type, in: query, schema: { type: string, enum: [Condo, HDB, Apartment, Landed] } }
        - { name: min_price, in: query, schema: { type: integer } }
        - { name: max_price, in: query, schema: { type: integer } }
        - { name: bedrooms, in: query, schema: { type: integer } }
        - { name: bbox, in: query, description: west,south,east,north, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { description: Paginated listing cards }, '422': { description: Invalid filter } }
  /listings/{slug}:
    get:
      summary: Listing detail and transactions
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Listing detail }, '404': { description: Not found } }
  /auth/register:
    post:
      summary: Register and issue token pair
      responses: { '201': { description: Account created }, '422': { description: Invalid account } }
  /auth/login:
    post:
      summary: Authenticate
      responses: { '200': { description: Access token, user profile and refresh cookie }, '401': { description: Invalid credentials } }
  /auth/refresh:
    post:
      summary: Rotate refresh token
      responses: { '200': { description: Rotated access token, user profile and refresh cookie }, '401': { description: Invalid session } }
  /me/ai-authorize:
    post:
      summary: Authorize one authenticated AI advisor request
      description: Applies per-user Redis quotas of 10 requests per minute and 100 per UTC day.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Authorized }
        '401': { description: Missing or invalid access token }
        '429': { description: AI advisor quota exceeded }
  /me/favourites:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Saved listings } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
