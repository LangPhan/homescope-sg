services:
  edge:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    environment:
      ORIGIN_SHARED_SECRET: ${ORIGIN_SHARED_SECRET:-}
    expose: ["8081"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./apps/api/public:/var/www/api/public:ro
    depends_on: [web, api]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_URL: http://localhost:8080
      API_INTERNAL_URL: http://edge:8081/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-cx/gpt-6-luna}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      REDIS_URL: redis://redis:6379
    expose: ["3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build:
      context: apps/api
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: homescope
      DB_USERNAME: homescope
      DB_PASSWORD: ${DB_PASSWORD:-homescope}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32chars}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    expose: ["9000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: homescope
      MYSQL_USER: homescope
      MYSQL_PASSWORD: ${DB_PASSWORD:-homescope}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-homescope}
    command: ["--mysql-native-password=ON"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  mysql-exporter-init:
    image: mysql:8.4
    profiles: ["observability"]
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-homescope}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-homescope-monitoring-local}
    volumes:
      - ./infra/observability/mysql-exporter-init.sh:/usr/local/bin/mysql-exporter-init:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-exporter-init"]
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.7
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.11.3
    profiles: ["observability"]
    command: ["run", "--storage.path=/var/lib/alloy", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      MYSQL_EXPORTER_DSN: exporter:${MYSQL_EXPORTER_PASSWORD:-homescope-monitoring-local}@(mysql:3306)/
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev:/run/udev:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
      mysql-exporter-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      edge: { condition: service_started }
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-homescope-grafana-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /tmp/homescope-provisioning
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-disabled:local}
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-0}"
    entrypoint: ["/bin/sh", "/usr/local/bin/homescope-grafana-entrypoint"]
    volumes:
      - ./infra/observability/grafana/entrypoint.sh:/usr/local/bin/homescope-grafana-entrypoint:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning-source:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
