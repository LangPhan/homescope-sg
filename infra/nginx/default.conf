map_hash_bucket_size 256;

map $http_x_request_id $correlation_id {
  default $http_x_request_id;
  "" $request_id;
}

map "$http_x_homescope_origin_token:${ORIGIN_SHARED_SECRET}" $origin_authorized {
  default 0;
  "${ORIGIN_SHARED_SECRET}:${ORIGIN_SHARED_SECRET}" 1;
}

log_format homescope_json escape=json '{"timestamp":"$time_iso8601","level":"info","service":"edge","event":"http_request","request_id":"$correlation_id","method":"$request_method","path":"$uri","status":$status,"request_time_seconds":$request_time,"upstream_time_seconds":"$upstream_response_time"}';

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  access_log /dev/stdout homescope_json;
  error_log /dev/stderr warn;

  if ($origin_authorized = 0) { return 404; }

  location = /api/v1/metrics { return 404; }
  location ^~ /api/internal/ { return 404; }

  location ^~ /api/ai/ {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_hide_header X-Request-ID;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header X-Accel-Buffering no;
    add_header X-Request-ID $correlation_id always;
  }

  location ^~ /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
    fastcgi_param SCRIPT_NAME /api/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_REQUEST_ID $correlation_id;
    fastcgi_hide_header X-Request-ID;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 30s;
    add_header X-Request-ID $correlation_id always;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $correlation_id always;
  }
}

server {
  listen 8081;
  server_name _;
  access_log off;

  location = /api/v1/metrics {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
    fastcgi_param SCRIPT_NAME /api/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
  }

  location ^~ /api/v1/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
    fastcgi_param SCRIPT_NAME /api/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 30s;
  }

  location = /api/internal/metrics {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/internal/health {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
}
