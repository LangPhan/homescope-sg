apiVersion: 1

groups:
  - orgId: 1
    name: HomeScope availability
    folder: HomeScope
    interval: 1m
    rules:
      - uid: homescope-service-down
        title: Service probe is down
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: min by (service) (probe_success)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: HomeScope service probe has failed for two minutes.
        labels: { severity: critical, environment: $APP_ENV }
      - uid: homescope-dependency-down
        title: MySQL or Redis is unavailable
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: min by (__name__) ({__name__=~"mysql_up|redis_up"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: A required data dependency is unavailable.
        labels: { severity: critical, service: data, environment: $APP_ENV }

  - orgId: 1
    name: HomeScope performance
    folder: HomeScope
    interval: 1m
    rules:
      - uid: homescope-http-5xx
        title: HTTP 5xx rate is above 5%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: (sum(rate(homescope_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(homescope_http_requests_total[5m])), 0.001)) and (sum(increase(homescope_http_requests_total[5m])) >= 20)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: More than 5% of requests are failing with at least 20 requests in five minutes.
        labels: { severity: critical, service: api, environment: $APP_ENV }
      - uid: homescope-api-p95
        title: API p95 latency is above 500ms
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(homescope_http_request_duration_seconds_bucket{service="api"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [0.5], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: API p95 latency has exceeded the 500ms SLO for ten minutes.
        labels: { severity: warning, service: api, environment: $APP_ENV }
      - uid: homescope-ai-errors
        title: AI provider errors
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum(increase(homescope_ai_provider_requests_total{outcome="error"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: The AI provider returned at least three errors in five minutes.
        labels: { severity: warning, service: ai, environment: $APP_ENV }

  - orgId: 1
    name: HomeScope capacity
    folder: HomeScope
    interval: 1m
    rules:
      - uid: homescope-container-memory
        title: Container memory is above 85%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max by (name) (container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [0.85], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: A container has used more than 85% of its memory limit for ten minutes.
        labels: { severity: warning, service: container, environment: $APP_ENV }
      - uid: homescope-container-restart
        title: Container restarted
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max by (name) (changes(container_start_time_seconds{name!=""}[10m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A container restart was detected during the last ten minutes.
        labels: { severity: warning, service: container, environment: $APP_ENV }
      - uid: homescope-disk-low
        title: Host disk free space is below 15%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              conditions:
                - evaluator: { params: [0.15], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Host disk free space is below 15%.
        labels: { severity: critical, service: host, environment: $APP_ENV }
