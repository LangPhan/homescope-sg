apiVersion: 1

contactPoints:
  - orgId: 1
    name: HomeScope Telegram
    receivers:
      - uid: homescope-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          # Pre-rendered by entrypoint.sh so Grafana keeps a numeric ID as a string.
          chatid: "__HOMESCOPE_TELEGRAM_CHAT_ID__"
          message: |
            {{ template "default.message" . }}

policies:
  - orgId: 1
    receiver: HomeScope Telegram
    group_by: [grafana_folder, service, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
